name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rusty-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Verify blind storage and public publication
        run: cargo test --locked
      - name: Build the service binary
        run: cargo build --locked --bin mesh-lighthouse
      - name: Verify real process discovery and restart
        run: python3 scripts/smoke_service.py target/debug/mesh-lighthouse
