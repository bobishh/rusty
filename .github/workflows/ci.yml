name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rusty-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  formal-models:
    name: Blind storage formal models
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Install pinned TLC
        env:
          TLC_SHA256: 936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88
        run: |
          jar="$RUNNER_TEMP/tla2tools-1.7.4.jar"
          curl -fL https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar -o "$jar"
          printf '%s  %s\n' "$TLC_SHA256" "$jar" | sha256sum --check --status
      - name: Check models and required counterexamples
        env:
          TLC_JAR: ${{ runner.temp }}/tla2tools-1.7.4.jar
        run: python3 formal/tla/run_models.py --logs "$RUNNER_TEMP/rusty-tlc"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: rusty-tlc-${{ github.sha }}
          path: ${{ runner.temp }}/rusty-tlc/
          if-no-files-found: ignore
          retention-days: 7
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Verify blind storage and public publication
        run: cargo test --locked
      - name: Build the service binary
        run: cargo build --locked --bin mesh-lighthouse
      - name: Verify real process discovery and restart
        run: python3 scripts/smoke_service.py target/debug/mesh-lighthouse
      - name: Verify immutable release sealing
        run: python3 -m unittest discover -s scripts -p test_seal_release.py

  publish-container:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, formal-models]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Authenticate container registry
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Build verified service revision
        run: |
          sdk_sha=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["dependencies"]["meta-mesh-core"]["rev"])')
          docker build --build-arg "RUSTY_BUILD_SHA=$GITHUB_SHA" --build-arg "RUSTY_SDK_SHA=$sdk_sha" --label "org.opencontainers.image.revision=$GITHUB_SHA" --label "org.opencontainers.image.source=https://github.com/bobishh/rusty" --tag "ghcr.io/bobishh/rusty:$GITHUB_SHA" .
      - name: Publish immutable service image
        run: docker push "ghcr.io/bobishh/rusty:$GITHUB_SHA"
      - name: Capture the exact published executable and immutable image identity
        run: |
          mkdir -p .release/rusty
          container=$(docker create "ghcr.io/bobishh/rusty:$GITHUB_SHA")
          docker cp "$container:/usr/local/bin/mesh-lighthouse" .release/rusty/mesh-lighthouse
          docker rm "$container"
          image=$(docker inspect --format '{{index .RepoDigests 0}}' "ghcr.io/bobishh/rusty:$GITHUB_SHA")
          python3 scripts/seal_release.py .release/rusty "$image"
      - uses: actions/upload-artifact@v6
        with:
          name: rusty-release-${{ github.sha }}-${{ github.run_attempt }}
          path: .release/rusty/
          if-no-files-found: error
          retention-days: 14
