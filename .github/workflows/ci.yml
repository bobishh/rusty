name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: match-ui-pin
        name: Read pinned Match UI revision
        run: |
          revision="$(sed -n 's/^ARG MATCH_UI_REV=//p' Dockerfile)"
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: bobishh/tincanban
          ref: ${{ steps.match-ui-pin.outputs.revision }}
          path: tincanban
      - name: Build frontend from pinned Match UI
        working-directory: frontend
        run: |
          npm ci
          cp -R ../tincanban/public/assets/. public/assets/
          MATCH_UI_SOURCE="$GITHUB_WORKSPACE/tincanban/src" npm run build
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Test Rust service
        run: cargo test --locked
      - name: Build service binary
        run: cargo build --locked
      - name: Build Match lifecycle test fixture binary
        run: cargo build --locked --features e2e-fixture --bin mesh-lighthouse
      - name: Smoke-test real service lifecycle processes
        env:
          LIGHTHOUSE_TEST_BINARY: ${{ github.workspace }}/target/debug/mesh-lighthouse
        run: |
          for test_name in \
            config_mode_sigterm_drains_http_and_exits_without_losing_durable_state \
            detached_identity_starts_with_empty_boards_and_provisioning_enabled; do
            result=$(cargo test --locked "$test_name" -- --ignored 2>&1) || {
              printf '%s\n' "$result"
              exit 1
            }
            printf '%s\n' "$result" | grep -q '1 passed; 0 failed' || {
              printf '%s\n' "$result"
              echo "Expected exactly one lifecycle test to execute: $test_name"
              exit 1
            }
          done
      - name: Download and verify pinned TLC
        env:
          TLC_SHA256: 936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88
        run: |
          jar="$RUNNER_TEMP/tla2tools-1.7.4.jar"
          curl -fL https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar -o "$jar"
          printf '%s  %s\n' "$TLC_SHA256" "$jar" | sha256sum --check --status
          java -version
      - name: Check lifecycle models and deliberate mutants
        env:
          TLC_JAR: ${{ runner.temp }}/tla2tools-1.7.4.jar
          TLC_LOGS: ${{ runner.temp }}/rusty-tlc
        run: python3 formal/run_models.py
