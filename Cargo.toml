[package]
name = "mesh-lighthouse"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "match_lighthouse"
path = "src/lib.rs"

[[bin]]
name = "mesh-lighthouse"
path = "src/main.rs"

[dependencies]
axum = "0.8"
base64 = "0.22"
hmac = "0.12"
meta-mesh-core = { git = "https://github.com/bobishh/meta-mesh.git", rev = "9f9ac7bbeddce4168e7d768fed35ca9f30d11595" }
rand = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors"] }
time = { version = "0.3.55", features = ["formatting"] }

# Keep receipt signing responsive during local debug replication.
[profile.dev.package.ed25519-compact]
opt-level = 3
