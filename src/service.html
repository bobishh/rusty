<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>rusty</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/rusty-head-32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/rusty-head-180.png">
    <link rel="stylesheet" href="/assets/design-system.css">
    <link rel="stylesheet" href="/assets/typography.css">
  </head>
  <body>
    <div class="shell keeper-admin">
      <header class="topbar">
        <div class="brand">
          <img class="rusty-mark" src="/assets/rusty-logo.webp" alt="Rusty" width="64" height="80">
          <div><h1>RUSTY</h1></div>
        </div>
      </header>
      <main class="admin-content">
        <section class="keeper-card" aria-labelledby="storage-title">
          <h2 id="storage-title">Board storage is available</h2>
          <p>Rusty keeps encrypted copies of your boards while devices are offline.</p>
          <p>To connect a board, open tincanban → Sync → Rusty, then enter this page's address.</p>
          <nav class="dialog-actions" aria-label="Rusty services">
            <a class="button" href="https://match.meta-uber-engineer.dev">Open tincanban</a>
            <a class="button" href="https://analytics.meta-uber-engineer.dev/admin/logs/rusty">View Rusty logs</a>
          </nav>
        </section>
      </main>
    </div>
  </body>
</html>
